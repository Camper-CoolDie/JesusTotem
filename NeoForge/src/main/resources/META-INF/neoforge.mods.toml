modLoader = "javafml"
license = "$mod_license"
loaderVersion = ">=1"
issueTrackerURL = "https://github.com/Camper-CoolDie/JesusTotem/issues"

[[mods]]
modId = "$mod_id"
version = "$mod_version"
displayName = "$mod_name"
displayURL = "https://modrinth.com/mod/godly-totem"
logoFile = "assets/jesustotem/icon.png"
authors = "$mod_author"
description = "$mod_description"

[[dependencies.jesustotem]]
modId = "neoforge"
type = "required"
versionRange = ">=$neoforge_version"
ordering = "NONE"
side = "CLIENT"

[[dependencies.jesustotem]]
modId = "minecraft"
type = "required"
versionRange = "$minecraft_version_range"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "jesustotem.mixins.json"
